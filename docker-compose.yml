services:
  redis: 
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  eligibility-service:
    build: ./eligibility-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
  eligibility-ambassador:
    build: ./eligibility-ambassador
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      UPSTREAM_URL: http://eligibility-service:3000
      UPSTREAM_TIMEOUT_MS: 1500
    depends_on:
      eligibility-service:
        condition: service_healthy
  grant-search-1:
    build: ./grant-search-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      PORT: 3000
      INSTANCE_ID: grant-search-1
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      ELIGIBILITY_AMBASSADOR_URL: http://eligibility-ambassador:3000
      FAULT: 0
    volumes:
      - grant-data:/data
    depends_on: 
      redis: 
        condition: service_healthy
      eligibility-ambassador:
        condition: service_healthy
  grant-search-2:
    build: ./grant-search-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      PORT: 3000
      INSTANCE_ID: grant-search-2
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      ELIGIBILITY_AMBASSADOR_URL: http://eligibility-ambassador:3000
      FAULT: 0
    volumes:
      - grant-data:/data
    depends_on: 
      redis: 
        condition: service_healthy
      eligibility-ambassador:
        condition: service_healthy        
  caddy: 
    image: caddy:2-alpine
    ports: 
      - "3000:8080"
    volumes: 
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: 
      grant-search-1:
        condition: service_healthy
      grant-search-2:
        condition: service_healthy

volumes:
  grant-data:
