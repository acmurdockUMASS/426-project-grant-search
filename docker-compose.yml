services:
  redis: 
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  eligibility-service:
    build: ./eligibility-service
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
  eligibility-ambassador:
    build: ./eligibility-ambassador
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      UPSTREAM_URL: http://eligibility-service:3000
      UPSTREAM_TIMEOUT_MS: 1500
    depends_on:
      eligibility-service:
        condition: service_healthy
  grant-search-1:
    build: ./grant-search-service
    environment:
      PORT: 3000
      INSTANCE_ID: grant-search-1
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      ELIGIBILITY_AMBASSADOR_URL: http://eligibility-ambassador:3000
    volumes:
      - grant-data:/data
    depends_on: 
      redis: 
        condition: service_healthy
      eligibility-ambassador:
        condition: service_healthy
  grant-search-2:
    build: ./grant-search-service
    environment:
      PORT: 3000
      INSTANCE_ID: grant-search-2
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      ELIGIBILITY_AMBASSADOR_URL: http://eligibility-ambassador:3000
    volumes:
      - grant-data:/data
    depends_on: 
      redis: 
        condition: service_healthy
      eligibility-ambassador:
        condition: service_healthy
  grant-alert-worker:
    build: ./grant-alert-worker
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq:5672
      GRANT_ALERT_QUEUE: grant-alert-jobs
      PROCESSING_DELAY_MS: 250
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
        
  caddy: 
    image: caddy:2-alpine
    ports: 
      - "3000:8080"
    volumes: 
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: 
      grant-search-1:
        condition: service_started
      grant-search-2:
        condition: service_started

volumes:
  grant-data:
