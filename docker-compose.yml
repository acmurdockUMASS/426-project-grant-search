services:
  redis: 
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: grantsearch
      RABBITMQ_DEFAULT_PASS: grantsearch-dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  eligibility-service:
    build: ./eligibility-service
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
  eligibility-ambassador:
    build: ./eligibility-ambassador
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      UPSTREAM_URL: http://eligibility-service:3000
      UPSTREAM_TIMEOUT_MS: 1500
    depends_on:
      eligibility-service:
        condition: service_healthy
  grant-search-1:
    build: ./grant-search-service
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      PORT: 3000
      INSTANCE_ID: grant-search-1
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      ELIGIBILITY_AMBASSADOR_URL: http://eligibility-ambassador:3000
      RABBITMQ_URL: amqp://grantsearch:grantsearch-dev@rabbitmq:5672
      GRANT_ALERT_QUEUE: grant-alert-jobs
      FAULT: ${GRANT_SEARCH_1_FAULT:-0}
    volumes:
      - grant-data:/data
    depends_on: 
      redis: 
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eligibility-ambassador:
        condition: service_healthy
  grant-search-2:
    build: ./grant-search-service
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      PORT: 3000
      INSTANCE_ID: grant-search-2
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      ELIGIBILITY_AMBASSADOR_URL: http://eligibility-ambassador:3000
      RABBITMQ_URL: amqp://grantsearch:grantsearch-dev@rabbitmq:5672
      GRANT_ALERT_QUEUE: grant-alert-jobs
      FAULT: ${GRANT_SEARCH_2_FAULT:-0}
    volumes:
      - grant-data:/data
    depends_on: 
      redis: 
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eligibility-ambassador:
        condition: service_healthy
  grant-alert-worker:
    build: ./grant-alert-worker
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://grantsearch:grantsearch-dev@rabbitmq:5672
      GRANT_ALERT_QUEUE: grant-alert-jobs
      PROCESSING_DELAY_MS: 250
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3004:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
  caddy: 
    image: caddy:2-alpine
    ports: 
      - "3000:8080"
    volumes: 
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: 
      grant-search-1:
        condition: service_healthy
      grant-search-2:
        condition: service_healthy

volumes:
  grant-data:
  rabbitmq-data:
