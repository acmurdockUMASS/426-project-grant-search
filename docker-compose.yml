services:
  grant-search:
    build: ./grant-search-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ELIGIBILITY_AMBASSADOR_URL: http://eligibility-ambassador:3000
    depends_on: 
      eligibility-ambassador:
        condition: service_healthy
    volumes:
      - grant-data:/data
  eligibility-service:
    build: ./eligibility-service
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
  eligibility-ambassador:
    build: ./eligibility-ambassador
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      UPSTREAM_URL: http://eligibility-service:3000
      UPSTREAM_TIMEOUT_MS: 1500
    depends_on:
      eligibility-service:
        condition: service_healthy

volumes:
  grant-data:
